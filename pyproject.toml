[tool.pytest.ini_options]
pythonpath = ["."]
testpaths  = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
